[metadata]
name = AI-Aquatica
version = 2.3.0
author = Tymoteusz Miller
author_email = tymoteusz.miller@usz.edu.pl
description = Reproducible machine-learning and hydrochemical analysis of water-quality data.
keywords = water quality, machine learning, environmental analysis, hydrochemistry, ai aquatica
long_description = file: README.md
long_description_content_type = text/markdown
license = MIT
url = https://github.com/TyMill/AI-Aquatica
project_urls =
    Documentation = https://tymill.github.io/AI-Aquatica/
    Source = https://github.com/TyMill/AI-Aquatica
    Issues = https://github.com/TyMill/AI-Aquatica/issues
classifiers =
    Development Status :: 4 - Beta
    Intended Audience :: Science/Research
    Intended Audience :: Education
    Operating System :: OS Independent
    Programming Language :: Python :: 3
    Programming Language :: Python :: 3.9
    Programming Language :: Python :: 3.10
    Programming Language :: Python :: 3.11
    Programming Language :: Python :: 3.12
    Programming Language :: Python :: 3.13
    Topic :: Scientific/Engineering :: Artificial Intelligence
    Topic :: Scientific/Engineering :: Hydrology
    Topic :: Scientific/Engineering :: Information Analysis

[options]
packages = find:
package_dir =
    = src
python_requires = >=3.9
include_package_data = True
install_requires =
    pandas
    numpy
    scikit-learn
    matplotlib
    seaborn
    jinja2
    scipy
    statsmodels


[options.packages.find]
where = src
exclude =
    tests
    tests.*

[options.extras_require]
api =
    requests
nosql =
    pymongo
excel =
    openpyxl
database =
    sqlalchemy
deep_learning =
    tensorflow
interactive =
    plotly
testing =
    pytest
    pytest-cov
    ruff==0.16.2
    build==1.5.0
    openpyxl
all =
    requests
    pymongo
    openpyxl
    sqlalchemy
    tensorflow
    plotly
    pytest

[options.package_data]
ai_aquatica =
    datasets/data/*.csv
    reporting/templates/*.html

[options.entry_points]
console_scripts =
    ai-aquatica=ai_aquatica.cli:main
