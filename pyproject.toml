[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra"
filterwarnings = [
    "ignore:FigureCanvasAgg is non-interactive:UserWarning",
]

[tool.ruff]
line-length = 100
target-version = "py39"
extend-exclude = [
    ".ipynb_checkpoints",
    "build",
    "dist",
    ".venv",
    "validation",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]


[tool.coverage.run]
source = ["ai_aquatica"]
omit = ["tests/*"]
